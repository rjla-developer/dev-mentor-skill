name: validate

# Known artifact: a pull request opened by the sync job shows a red X with zero jobs.
# That is GitHub declining to trigger workflows for an event raised with GITHUB_TOKEN,
# not a failing check. Do not chase it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: pip install --quiet jsonschema

      - name: Validate the registry
        run: python3 scripts/validate_registry.py

      - name: Validate the skills
        run: python3 scripts/validate_skills.py

      - name: Check every eval scenario parses and declares expectations
        run: |
          python3 - <<'PY'
          import glob, json, sys
          failed = False
          for path in sorted(glob.glob("evals/*.json")):
              data = json.load(open(path, encoding="utf-8"))
              for field in ("id", "title", "user_prompt", "expected_behavior", "failure_modes"):
                  if not data.get(field):
                      print("ERROR {}: missing {}".format(path, field)); failed = True
              if not isinstance(data.get("expected_behavior"), list) or len(data["expected_behavior"]) < 3:
                  print("ERROR {}: expected_behavior needs at least 3 observable items".format(path))
                  failed = True
          sys.exit(1 if failed else 0)
          PY
